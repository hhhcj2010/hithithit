<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双人对战 · 测试版</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: radial-gradient(circle at 50% 30%, #131c33 0%, #070a14 70%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto,
                 "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #wrap {
    position: relative;
    width: min(96vw, calc(92vh * 16 / 9), 1200px);
    aspect-ratio: 16 / 9;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65),
                0 0 0 1px rgba(148, 163, 184, 0.18) inset;
  }

  #game {
    display: block;
    width: 100%;
    height: 100%;
  }

  #hud {
    position: absolute;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    padding: 8px 18px;
    background: rgba(8, 15, 30, 0.62);
    border: 1px solid rgba(148, 163, 184, 0.22);
    border-radius: 999px;
    color: #e2e8f0;
    font-size: clamp(11px, 1.35vw, 15px);
    letter-spacing: 0.5px;
    white-space: nowrap;
    pointer-events: none;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    user-select: none;
  }

  #hud b { color: #4ade80; font-weight: 700; }

  #startScreen {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(3, 7, 18, 0.82);
    backdrop-filter: blur(9px);
    -webkit-backdrop-filter: blur(9px);
    color: #f8fafc;
  }
  #startScreen.hidden { display: none; }
  .menu-card {
    width: min(88%, 430px);
    padding: 30px;
    border: 1px solid rgba(148,163,184,.3);
    border-radius: 20px;
    background: linear-gradient(145deg, rgba(30,41,59,.96), rgba(8,15,30,.97));
    box-shadow: 0 24px 70px rgba(0,0,0,.5);
    text-align: center;
  }
  .menu-card h1 { margin: 0 0 8px; font-size: clamp(25px, 4vw, 36px); }
  .menu-card p { color: #94a3b8; margin: 0 0 24px; font-size: 14px; }
  .menu-card label { display:block; text-align:left; margin: 0 0 8px; color:#cbd5e1; font-size:14px; }
  #difficulty {
    width:100%; padding:12px; border-radius:10px; border:1px solid #475569;
    background:#0f172a; color:#f8fafc; font-size:15px; margin-bottom:16px;
  }
  #startButton, #menuButton {
    border:0; border-radius:10px; padding:12px 20px; font-weight:700;
    cursor:pointer; color:#052e16; background:#4ade80; font-size:16px;
  }
  #startButton { width:100%; }
  #startButton:hover { background:#86efac; }
  #menuButton {
    position:absolute; z-index:4; right:14px; bottom:14px; padding:8px 13px;
    font-size:12px; color:#e2e8f0; background:rgba(15,23,42,.8);
    border:1px solid rgba(148,163,184,.3);
  }

  #skillBar {
    display: none;
    position: absolute;
    left: 28px;
    top: 104px;
    transform: none;
    display: flex;
    gap: 5px;
    z-index: 3;
    pointer-events: none;
    user-select: none;
  }
  .skill-card {
    width: 61px;
    height: 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    border: 1px solid rgba(148,163,184,.32);
    border-radius: 8px;
    background: rgba(8,15,30,.72);
    color: #e2e8f0;
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
    backdrop-filter: blur(3px);
  }
  .skill-icon { width: 17px; height: 17px; filter: drop-shadow(0 0 3px currentColor); }
  .skill-key { display:none; }
  .skill-name { font-size: 9px; font-weight: 700; line-height: 1; }
  .skill-cd { font-size: 9px; font-weight: 700; color: #fbbf24; line-height: 1; }
  .skill-cd.ready { color: #4ade80; }
  .skill-cd.cooling { color: #fbbf24; }
  .skill-card.light { color: #e2e8f0; }
  .skill-card.pistol { color: #facc15; }
  .skill-card.heavy { color: #60a5fa; }
  .skill-card.ultimate { color: #fb923c; }
  .skill-card.parry { color: #facc15; }
  @media (max-width: 650px) {
    #skillBar { left: 14px; top: 96px; gap: 3px; }
    .skill-card { width: 52px; height: 43px; }
    .skill-icon { width: 15px; height: 15px; }
    .skill-name, .skill-cd { font-size: 8px; }
  }

</style>
</head>
<body>

<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="skillBar" aria-label="技能冷却状态">
    <div class="skill-card light">
      <svg class="skill-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M6 26L23 9l3-6 3 3-6 3L6 26Z" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M4 22l6 6M18 14l4 4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M22 5l5 5" stroke="currentColor" stroke-width="1.6"/></svg>
      <span class="skill-key">J</span><span class="skill-name">轻击</span><span id="skillLight" class="skill-cd ready">就绪</span>
    </div>
    <div class="skill-card pistol">
      <svg class="skill-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M4 9h22v7H17l-3 5H9l2-5H4V9Z" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M21 16v5M25 10l4-2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M7 12h8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span class="skill-key">I</span><span class="skill-name">手枪</span><span id="skillPistol" class="skill-cd ready">就绪</span>
    </div>
    <div class="skill-card heavy">
      <svg class="skill-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M15 5v21M10 26h10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path d="M5 6h22v8H5z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M8 6l-2-3M24 6l2-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="skill-key">K</span><span class="skill-name">重击</span><span id="skillHeavy" class="skill-cd ready">就绪</span>
    </div>
    <div class="skill-card ultimate">
      <svg class="skill-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M17 3c2 7-5 8-3 14 1-2 3-3 5-4 5 7 2 15-5 16-7 0-11-7-7-13 1 4 3 4 4 5C9 13 17 11 17 3Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M16 21c3 3 1 7-2 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span class="skill-key">L</span><span class="skill-name">大招</span><span id="skillUltimate" class="skill-cd ready">就绪</span>
    </div>
    <div class="skill-card parry">
      <svg class="skill-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 3l11 4v8c0 7-4 11-11 14C9 26 5 22 5 15V7l11-4Z" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"/><path d="M10 16l4 4 8-9" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="skill-key">Space</span><span class="skill-name">防反</span><span id="skillParry" class="skill-cd ready">就绪</span>
    </div>
  </div>
  <div id="startScreen">
    <div class="menu-card">
      <h1>双人对战</h1>
      <p>挑战 AI · 选择你的对手难度</p>
      <label for="difficulty">AI 难度</label>
      <select id="difficulty">
        <option value="dummy">训练假人（不进行任何操作）</option>
        <option value="easy">菜鸟（简单）</option>
        <option value="normal" selected>学徒（中等）</option>
        <option value="hard">队长（困难）</option>
        <option value="master">大师</option>
        <option value="expert">专家</option>
      </select>
      <button id="startButton">开始战斗</button>
    </div>
  </div>
  <button id="menuButton" type="button">返回开始界面</button>
  <div id="hud">
    <b>A</b> / <b>D</b> 移动
    &nbsp;·&nbsp;
    <b>W</b> 二段跳
    &nbsp;·&nbsp;
    <b>S</b> 蹲防（霸体 / 减伤20% / 禁止攻击）
    &nbsp;·&nbsp;
    <b>J</b> 轻击
    &nbsp;·&nbsp;
    <b>I</b> 手枪
    &nbsp;·&nbsp;
    <b>K</b> 按住蓄力 / 松开重击
    &nbsp;·&nbsp;
    <b>L</b> 大招
    &nbsp;·&nbsp;
    <b>Space</b> 防反 / 僵直脱困
    &nbsp;·&nbsp;
    <b>R</b> 重置
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
